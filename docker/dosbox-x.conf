# DOSBox-X config for the Paratrooper (1982) RL POC.
# Stage 0 requirements: sound disabled, fixed (non-auto) CPU cycles,
# runs headless under Xvfb (no fullscreen/GL needed -> output=surface).

[sdl]
fullscreen = false
output     = surface
autolock   = false

[dosbox]
machine                   = cga
captures                  = /captures
working directory option  = noprompt
startbanner               = false
quit warning              = false

[cpu]
core      = auto
cycles    = fixed 3000
cycleup   = 500
cycledown = 20

[speaker]
pcspeaker = false

[sblaster]
sbtype = none

[autoexec]
mount c /work/game
c:
paratroo
