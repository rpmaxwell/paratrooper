# DOSBox-X config template for Paratrooper (1982): sound off, fixed CPU cycles,
# headless under Xvfb (output=surface). paratrooper/emulator/docker.py writes the
# config a container runs from this file: it sets `cycles` and, for
# speed = "turbo", adds the turbo lines after `cycledown`.

[sdl]
fullscreen = false
output     = surface
autolock   = false

[dosbox]
machine                   = cga
captures                  = /captures
working directory option  = noprompt
startbanner               = false
quit warning              = false

[cpu]
core      = auto
cycles    = fixed 3000
cycleup   = 500
cycledown = 20

[speaker]
pcspeaker = false

[sblaster]
sbtype = none

[autoexec]
mount c /work/game
c:
paratroo
